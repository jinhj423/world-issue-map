name: 뉴스 수집 (30분마다)

on:
  schedule:
    - cron: "7,37 * * * *"  # 30분 간격 (정각 혼잡 회피)
  workflow_dispatch: {}    # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집
        run: python scripts/fetch_news.py
      - name: 변경분 커밋
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add public/data/news.json public/data/history.json
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 갱신"
          git push
