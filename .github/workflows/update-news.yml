name: 뉴스 수집 (10분마다)

# 주 경로: Cloudflare Worker(wnm)가 매시 7·22·37·52분에 workflow_dispatch로 깨운다(정확함).
# 보조 경로: GitHub 자체 예약 — 자주 수 시간 밀리므로, Worker가 멈췄을 때만 대신하도록
#            마지막 수집이 8분 안이면 건너뛴다.
# 데이터 커밋에는 [skip ci]를 붙여 Cloudflare 재배포를 일으키지 않는다(사이트는 Worker가 저장소에서 직접 읽음).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "45 * * * *"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 지난 데이터 받기 (data 브랜치)
        run: |
          # 수집 결과는 커밋 기록이 쌓이지 않게 data 브랜치(커밋 1개)에만 둔다
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:news.json > public/data/news.json
            git show FETCH_HEAD:history.json > public/data/history.json
            git show FETCH_HEAD:archive.json > public/data/archive.json 2>/dev/null || true
          fi

      - name: 최근 수집 확인 (보조 예약 실행만)
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime
          try:
              d = json.load(open("public/data/news.json"))
              t = datetime.datetime.fromisoformat(d["updated_at"])
              age = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() / 60
              print("skip=" + ("true" if age < 8 and not d.get("preview") else "false"))
          except Exception:
              print("skip=false")
          PY

      - name: 수집
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/fetch_news.py

      - name: 텔레그램 채널 게시 (하루 2번, 비밀값이 있을 때만)
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_post.py

      - name: data 브랜치에 올리기
        if: steps.fresh.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d=$(mktemp -d)
          cp public/data/news.json public/data/history.json public/data/archive.json "$d"/
          cd "$d"
          git init -q -b data
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json history.json archive.json
          git commit -q -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 갱신 [skip ci]"
          # 기록 없이 덮어쓴다(저장소 용량이 늘지 않음)
          for i in 1 2 3; do
            git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data && exit 0
            sleep $((i * 5))
          done
          exit 1
