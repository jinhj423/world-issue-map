name: 뉴스 수집 (15분마다)

# 주 경로: Cloudflare Worker(wnm)가 매시 7·22·37·52분에 workflow_dispatch로 깨운다(정확함).
# 보조 경로: GitHub 자체 예약 — 자주 수 시간 밀리므로, Worker가 멈췄을 때만 대신하도록
#            마지막 수집이 12분 안이면 건너뛴다.
# 데이터 커밋에는 [skip ci]를 붙여 Cloudflare 재배포를 일으키지 않는다(사이트는 Worker가 저장소에서 직접 읽음).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "45 * * * *"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 최근 수집 확인 (보조 예약 실행만)
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime
          try:
              d = json.load(open("public/data/news.json"))
              t = datetime.datetime.fromisoformat(d["updated_at"])
              age = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() / 60
              print("skip=" + ("true" if age < 12 and not d.get("preview") else "false"))
          except Exception:
              print("skip=false")
          PY

      - name: 수집
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/fetch_news.py

      - name: 변경분 커밋
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add public/data/news.json public/data/history.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 갱신 [skip ci]"
          # 다른 커밋과 겹치면 받아서 다시 올린다 (최대 4번)
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
