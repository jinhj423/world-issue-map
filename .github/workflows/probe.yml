name: 임시 점검 (일정 출처)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for u in "https://www.bls.gov/schedule/news_release/bls.ics" "https://www.bls.gov/schedule/2026/11_sched.htm" \
                   "https://www.bea.gov/news/schedule/ics/online-calendar-subscription.ics" "https://www.bea.gov/news/schedule/full" "https://www.bea.gov/news/schedule" \
                   "https://www.census.gov/economic-indicators/calendar-listview.html" \
                   "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm" \
                   "https://api.nasdaq.com/api/calendar/earnings?date=2026-11-19" ; do
            code=$(curl -s -L -A "$B" -H "Accept-Language: en-US,en;q=0.9" -o /tmp/o -w "%{http_code}" "$u"); echo "== $code $(wc -c </tmp/o)B $u"; head -c 300 /tmp/o | tr '\n' ' '; echo
          done
          echo "--- bls ics sample"; curl -s -L -A "$B" https://www.bls.gov/schedule/news_release/bls.ics | grep -m6 -A3 "SUMMARY:Consumer Price\|SUMMARY:Employment Sit" | head -30
          echo "--- bea ics sample"; curl -s -L -A "$B" https://www.bea.gov/news/schedule/ics/online-calendar-subscription.ics | grep -m8 "SUMMARY\|DTSTART" | head -16
