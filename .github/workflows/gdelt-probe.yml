name: gdelt-probe

on:
  push:
    branches: [probe-gdelt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 지금 사이트 자료 받기
        run: |
          git fetch -q origin data --depth=1
          git show origin/data:news.json > /tmp/news.json
      - name: GDELT 시험
        run: python3 scripts/probe_gdelt.py /tmp/news.json
      - uses: actions/upload-artifact@v4
        with:
          name: gdelt-probe
          path: /tmp/gdelt_probe.json
